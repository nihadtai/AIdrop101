<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brain</title><style>
:root{color-scheme:dark;--black:#050505;--line:#2b2b2b;--muted:#8a8a8a;--ink:#f5f5f1}*{box-sizing:border-box}body{margin:0;background:var(--black);color:var(--ink);font:14px ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.app{min-height:100vh;padding:22px 28px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:18px}.brand{display:flex;align-items:baseline;gap:12px}.brand h1{font-size:16px;letter-spacing:.14em;text-transform:uppercase;margin:0}.brand span{color:var(--muted);font-size:12px}.tools{display:flex;align-items:center;gap:8px}.tools input{width:230px;background:transparent;border:0;border-bottom:1px solid #484848;color:var(--ink);padding:7px 2px;outline:0}.tools input:focus{border-color:#fff}button{background:transparent;border:1px solid #383838;color:#d9d9d9;border-radius:99px;padding:7px 11px;font:12px inherit;cursor:pointer}button:hover,button.active{background:#f4f4ef;color:#080808;border-color:#f4f4ef}.filters{display:flex;gap:7px;overflow:auto;padding:16px 0 12px}.filters button{white-space:nowrap}.workspace{height:calc(100vh - 128px);min-height:620px;border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative;background:#070707}.workspace:before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(#181818 1px,transparent 1px),linear-gradient(90deg,#181818 1px,transparent 1px);background-size:40px 40px;opacity:.24}.caption{position:absolute;z-index:3;left:18px;top:15px;color:#888;font-size:12px}.caption b{color:#fff;font-weight:500}.controls{position:absolute;z-index:3;right:16px;top:13px;display:flex;gap:6px}.controls button{width:30px;height:30px;padding:0;font-size:15px}.detail{position:absolute;z-index:4;left:16px;bottom:16px;width:min(490px,calc(100% - 32px));padding:16px 18px;border:1px solid #383838;border-radius:11px;background:rgba(8,8,8,.95);backdrop-filter:blur(14px);transform:translateY(calc(100% + 22px));transition:transform .2s ease}.detail.open{transform:translateY(0)}.detail h2{font-size:16px;margin:0 0 5px}.detail p{color:#aaa;line-height:1.5;margin:9px 0}.detail code{font-size:11px;color:#777}.detail .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px}.detail .related{display:flex;gap:5px;overflow:auto;margin-top:12px}.detail .related button{font-size:11px}.detail .close{position:absolute;right:10px;top:10px;border:0;padding:4px;color:#888}.hint{color:#777;font-size:12px}.metric{display:flex;gap:13px;margin-top:10px;color:#888;font-size:11px}.metric b{color:#eee;font-weight:500}svg{width:100%;height:100%;display:block;cursor:grab;position:relative;z-index:1}svg.dragging{cursor:grabbing}.domain-card{fill:#0b0b0b;stroke:#303030;stroke-width:1}.domain-card.active{stroke:#f4f4ef;stroke-width:1.3}.edge{stroke:#454545;stroke-width:1;opacity:.8}.edge.related{stroke:#eee;stroke-width:1.35;opacity:.92}.node{cursor:pointer}.node rect{fill:#141414;stroke:#4a4a4a;stroke-width:1;transition:.14s}.node:hover rect,.node.selected rect{fill:#f4f4ef;stroke:#fff}.node text{fill:#c9c9c6;font-size:11px;pointer-events:none}.node:hover text,.node.selected text{fill:#090909}.category text{fill:#fff;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}.category .count{fill:#858585;font-weight:400;font-size:10px;letter-spacing:0}.empty-state{fill:#777;font-size:14px}dialog{width:min(920px,94vw);height:min(82vh,780px);background:#090909;color:#eee;border:1px solid #484848;border-radius:12px;padding:0}dialog header{padding:16px 18px;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#090909}pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;padding:20px;font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;color:#ccc}@media(max-width:700px){.app{padding:15px}.top{align-items:flex-start;flex-direction:column}.tools{width:100%}.tools input{flex:1}.workspace{height:calc(100vh - 180px);min-height:540px}.caption{display:none}}
</style></head><body><main class="app"><header class="top"><div class="brand"><h1>AI Context</h1><span id="count">Knowledge map</span></div><div class="tools"><input id="search" placeholder="Search references"><button onclick="openSelected()">Read</button><button onclick="resetView()">Reset</button></div></header><nav class="filters" id="filters"></nav><section class="workspace"><div class="caption"><b>Project Brain</b> · ordered by domain and reference · select a node to trace its dependencies</div><div class="controls"><button onclick="zoom(.84)">−</button><button onclick="zoom(1.2)">+</button><button onclick="fit()">⌘</button></div><svg id="graph" viewBox="0 0 1440 960" aria-label="Interactive project knowledge map"><g id="viewport"><g id="cards"></g><g id="edges"></g><g id="nodes"></g></g></svg><aside class="detail" id="detail"><button class="close" onclick="closeDetail()">×</button><div id="detailBody"><h2>Ordered project map</h2><p>Each block is a domain. References are alphabetized within their domain. Select a reference to reveal only its direct relationships.</p></div></aside></section></main><dialog id="viewer"><header><strong id="docTitle">Reference</strong><button onclick="viewer.close()">Close</button></header><pre id="docContent"></pre></dialog><script>
const svg=document.querySelector('#graph'),viewport=document.querySelector('#viewport'),cards=document.querySelector('#cards'),edges=document.querySelector('#edges'),nodesEl=document.querySelector('#nodes'),filters=document.querySelector('#filters'),detail=document.querySelector('#detail'),body=document.querySelector('#detailBody'),viewer=document.querySelector('#viewer');let docs=[],nodes=[],selected=null,category='all',query='',view={x:0,y:0,s:1},pan=null,drag=null;const order=['foundation','architecture','runtime','workflow','agents','integrations','web','governance'];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const trim=(s,n)=>s.length>n?s.slice(0,n-1)+'…':s;
function point(e){const r=svg.getBoundingClientRect();return{x:(e.clientX-r.left)*1440/r.width,y:(e.clientY-r.top)*960/r.height}}function visible(n){return n.type==='category'||((category==='all'||n.category===category)&&(!query||(`${n.title} ${n.file} ${n.description}`).toLowerCase().includes(query)))}function render(){viewport.setAttribute('transform',`translate(${view.x} ${view.y}) scale(${view.s})`);const byId=Object.fromEntries(nodes.map(n=>[n.id,n])),shown=new Set(nodes.filter(visible).map(n=>n.id));cards.innerHTML='';edges.innerHTML='';nodesEl.innerHTML='';const activeDocs=nodes.filter(n=>n.type==='document'&&shown.has(n.id));const activeCategories=new Set(activeDocs.map(n=>n.category));nodes.filter(n=>n.type==='category'&&(category==='all'||n.category===category)).forEach(n=>drawCard(n,activeCategories.has(n.category)));activeDocs.forEach(n=>edge(byId['cat:'+n.category],n,false));if(selected){const focus=byId[selected];if(focus?.type==='document')focus.related.forEach(id=>{const other=byId[id];if(other&&shown.has(id))edge(focus,other,true)})}nodes.filter(n=>shown.has(n.id)&&n.type==='category').forEach(draw);activeDocs.forEach(draw);if(!activeDocs.length){const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x','720');t.setAttribute('y','470');t.setAttribute('text-anchor','middle');t.setAttribute('class','empty-state');t.textContent='No references match this search.';nodesEl.appendChild(t)}}
function drawCard(n,active){const r=document.createElementNS('http://www.w3.org/2000/svg','rect');r.setAttribute('x',n.box.x);r.setAttribute('y',n.box.y);r.setAttribute('width',n.box.w);r.setAttribute('height',n.box.h);r.setAttribute('rx','14');r.setAttribute('class','domain-card '+(active?'active':''));cards.appendChild(r)}function edge(a,b,related){if(!a||!b)return;const line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',a.x);line.setAttribute('y1',a.y+18);line.setAttribute('x2',b.x);line.setAttribute('y2',b.y);line.setAttribute('class','edge '+(related?'related':''));edges.appendChild(line)}function draw(n){const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.setAttribute('class','node '+n.type+(selected===n.id?' selected':''));if(n.type==='category'){g.setAttribute('transform',`translate(${n.x} ${n.y})`);const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.textContent=n.title;g.appendChild(t);const c=document.createElementNS('http://www.w3.org/2000/svg','text');c.setAttribute('class','count');c.setAttribute('x','0');c.setAttribute('y','18');c.textContent=`${n.docs.length} references`;g.appendChild(c)}else{g.setAttribute('transform',`translate(${n.x-118} ${n.y-16})`);const r=document.createElementNS('http://www.w3.org/2000/svg','rect');r.setAttribute('width','236');r.setAttribute('height','32');r.setAttribute('rx','7');g.appendChild(r);const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x','12');t.setAttribute('y','20');t.textContent=trim(n.title,31);g.appendChild(t)}g.addEventListener('click',e=>{e.stopPropagation();select(n.id)});g.addEventListener('pointerdown',e=>{e.stopPropagation();if(n.type==='document'){drag={n,last:point(e)};svg.setPointerCapture(e.pointerId)}});nodesEl.appendChild(g)}
function select(id){selected=id;const n=nodes.find(x=>x.id===id);if(!n)return;if(n.type==='category'){choose(n.category);return}render();detail.classList.add('open');const related=n.related.map(id=>nodes.find(x=>x.id===id)).filter(Boolean);body.innerHTML=`<h2>${esc(n.title)}</h2><code>${esc(n.file)}</code><p>${esc(n.description)}</p><div class="row"><button onclick="openSelected()">Read reference</button><span class="hint">${related.length} direct links</span></div><div class="related">${related.map(x=>`<button onclick="select('${x.id}')">${esc(trim(x.title,22))}</button>`).join('')||'<span class="hint">No explicit links</span>'}</div><div class="metric" id="metric">Loading runtime metrics…</div>`;metrics()}
function choose(c){category=c;selected=null;document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b.dataset.category===c));document.querySelector('#count').textContent=c==='all'?`${docs.length} references`:`${docs.filter(d=>d.category===c).length} in ${c}`;closeDetail();render()}function closeDetail(){detail.classList.remove('open')}function setup(data){docs=data.documents;const groupNames=[...new Set(docs.map(d=>d.category))].sort((a,b)=>{const ai=order.indexOf(a),bi=order.indexOf(b);return(ai<0?99:ai)-(bi<0?99:bi)||a.localeCompare(b)});const cols=4,w=320,h=390;nodes=[];groupNames.forEach((c,i)=>{const col=i%cols,row=Math.floor(i/cols),x=50+col*350,y=95+row*440,group=docs.filter(d=>d.category===c).sort((a,b)=>a.title.localeCompare(b.title)),hub={id:'cat:'+c,type:'category',category:c,title:c,x:x+20,y:y+28,box:{x,y,w,h},docs:group};nodes.push(hub);group.forEach((d,j)=>{const cellCol=j%2,cellRow=Math.floor(j/2);nodes.push({...d,id:d.id,type:'document',x:x+82+cellCol*156,y:y+91+cellRow*58})})});filters.innerHTML=`<button class="filter active" data-category="all" onclick="choose('all')">All · ${docs.length}</button>`+groupNames.map(c=>`<button class="filter" data-category="${c}" onclick="choose('${c}')">${c} · ${docs.filter(d=>d.category===c).length}</button>`).join('');document.querySelector('#count').textContent=`${docs.length} references`;render()}
function openSelected(){const n=nodes.find(n=>n.id===selected);if(!n||n.type!=='document'){detail.classList.add('open');body.innerHTML='<h2>Select a reference</h2><p>Pick a document node to read its full Markdown context.</p>';return}fetch('/api/ai-context/documents/'+n.id).then(r=>r.json()).then(d=>{document.querySelector('#docTitle').textContent=d.title+' · '+d.file;document.querySelector('#docContent').textContent=d.content;viewer.showModal()})}function resetView(){view={x:0,y:0,s:1};query='';document.querySelector('#search').value='';choose('all')}function fit(){view={x:0,y:0,s:1};render()}function zoom(f){view.s=Math.max(.45,Math.min(2.7,view.s*f));render()}svg.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.1:.91)},{passive:false});svg.addEventListener('pointerdown',e=>{if(e.target===svg||e.target===viewport||e.target===edges||e.target===cards){pan={p:point(e),x:view.x,y:view.y};svg.setPointerCapture(e.pointerId);svg.classList.add('dragging')}});svg.addEventListener('pointermove',e=>{const p=point(e);if(drag){drag.n.x+=(p.x-drag.last.x)/view.s;drag.n.y+=(p.y-drag.last.y)/view.s;drag.last=p;render()}else if(pan){view.x=pan.x+p.x-pan.p.x;view.y=pan.y+p.y-pan.p.y;render()}});svg.addEventListener('pointerup',()=>{pan=null;drag=null;svg.classList.remove('dragging')});document.querySelector('#search').addEventListener('input',e=>{query=e.target.value.toLowerCase();render()});async function metrics(){try{const s=(await fetch('/api/ai-context/telemetry').then(r=>r.json())).summary,m=document.querySelector('#metric');if(m)m.innerHTML=`<b>${s.calls} calls</b><span>${s.cache_hit_rate}% cache</span><span>${Number(s.estimated_input_tokens_saved).toLocaleString()} tokens saved</span>`}catch{}}fetch('/api/ai-context/documents').then(r=>r.json()).then(setup);
</script></body></html>
